<h1>Meu carrinho</h1>

@for (item of cart.cartItems() ?? [];
      track item.product.id) {
  <div class="cartItem">
    <h3>{{ item.product.name }}</h3>
    <span>
      Quantidade: {{ item.quantity }} ----- {{ item.product.price
        | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
    </span>
    <button (click)="cart.removeProduct(item.product.id)">
      Remover
    </button>
  </div>
} @empty {
  <p>Seu carrinho está vazio.</p>
}

<button (click)="cart.clearCart()">
  Limpar carrinho
</button>
